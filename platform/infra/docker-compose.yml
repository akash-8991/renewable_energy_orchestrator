name: reo

x-python-env: &python-env
  DATABASE_URL: postgresql+psycopg2://reo:reo@postgres:5432/reo
  ASYNC_DATABASE_URL: postgresql+asyncpg://reo:reo@postgres:5432/reo
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: reo-minio
  S3_SECRET_KEY: reo-minio-secret
  S3_REGION: eu-west-1
  DATA_WATCH_DIR: /data
  ENVIRONMENT: local
  # Model gateway — shared across every service since both agent-worker (all
  # specialist agents) and api (document-intake vision, apps/api/app/routers
  # /ingestion.py) construct a ModelGateway. A service that never calls
  # get_model_gateway() simply ignores these.
  MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
  OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
  OPENROUTER_SITE_NAME: ${OPENROUTER_SITE_NAME:-Renewable Energy Orchestrator}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
  MODEL_RATE_LIMIT_PER_MINUTE: ${MODEL_RATE_LIMIT_PER_MINUTE:-20}
  MODEL_RATE_LIMIT_PER_DAY: ${MODEL_RATE_LIMIT_PER_DAY:-2000}

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: reo
      POSTGRES_PASSWORD: reo
      POSTGRES_DB: reo
    ports: ["127.0.0.1:5433:5432"]  # 5433 on the host: 5432 is often taken by a native/Homebrew postgres; containers use "postgres:5432" internally
    volumes: ["reo-postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reo -d reo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]  # 6380 on the host: 6379 is often taken by a native redis; containers use "redis:6379" internally
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reo-minio
      MINIO_ROOT_PASSWORD: reo-minio-secret
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["reo-minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }  # not just service_started: on a fresh volume minio
                                              # is still formatting its pool when the container
                                              # itself starts, and `mc alias set` was racing that —
                                              # first-ever `docker compose up` on a clean volume
                                              # failed here every time.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 reo-minio reo-minio-secret &&
      mc mb -p local/reo-exports local/reo-lakehouse local/reo-quarantine &&
      exit 0"

  migrate:
    build: { context: ../.., dockerfile: platform/apps/api/Dockerfile }
    environment: *python-env
    depends_on: { postgres: { condition: service_healthy } }
    working_dir: /app/platform/db
    entrypoint: ["alembic", "upgrade", "head"]

  api:
    build: { context: ../.., dockerfile: platform/apps/api/Dockerfile }
    environment:
      <<: *python-env
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000  # browsers/curl on the host use this; container-to-container S3 calls still use S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["../../data:/data:ro"]

  optimizer-worker:
    build: { context: ../.., dockerfile: platform/apps/optimizer-worker/Dockerfile }
    environment: *python-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  agent-worker:
    build: { context: ../.., dockerfile: platform/apps/agent-worker/Dockerfile }
    environment: *python-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  ot-gateway-sim:
    build: { context: ../.., dockerfile: platform/apps/ot-gateway-sim/Dockerfile }
    environment: *python-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports: ["127.0.0.1:8010:8010"]

  edge-simulator:
    build: { context: ../.., dockerfile: platform/apps/edge-simulator/Dockerfile }
    environment: *python-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    volumes: ["../../data:/data"]

  export-worker:
    build: { context: ../.., dockerfile: platform/apps/export-worker/Dockerfile }
    environment: *python-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ../../platform/apps/web }
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [api]

volumes:
  reo-postgres-data:
  reo-minio-data:
