[project]
name = "reo-common"
version = "0.1.0"
description = "Shared canonical models, schemas, auth, tenancy, model gateway and secrets provider for the Renewable Energy Orchestrator platform"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "greenlet>=3.0",  # required by sqlalchemy.ext.asyncio at import time (db.py imports it unconditionally); previously satisfied only transitively, which a fresh pip resolve isn't guaranteed to do
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "cryptography>=42.0",
    "redis>=5.0",
    "anthropic>=0.34",
    "httpx>=0.27",
    "authlib>=1.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reo_common*"]
