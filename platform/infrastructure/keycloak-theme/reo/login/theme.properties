# Reskins Keycloak's stock login page to match the platform dashboard's own
# login screen (frontend/src/styles.css's .login-* rules) — same brand
# gradient, card style, button/input styling and font stack — so a user
# redirected here for SSO doesn't land on a visually unrelated page.
#
# Deliberately CSS-only: `parent=keycloak.v2` inherits every real Keycloak
# template (login.ftl, error handling, WebAuthn, OTP, etc.) unchanged, and
# `styles` appends reo.css on top of the base stylesheet rather than
# replacing it, so nothing about Keycloak's actual login behavior changes —
# only its appearance.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/reo.css
