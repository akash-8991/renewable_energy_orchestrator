name: reo

x-python-env: &python-env
  DATABASE_URL: postgresql+psycopg2://reo:reo@postgres:5432/reo
  ASYNC_DATABASE_URL: postgresql+asyncpg://reo:reo@postgres:5432/reo
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://seaweedfs:8333
  S3_ACCESS_KEY: reo-minio
  S3_SECRET_KEY: reo-minio-secret
  S3_REGION: eu-west-1
  DATA_WATCH_DIR: /data
  ENVIRONMENT: local
  # Model gateway — shared across every service since both agent-worker (all
  # specialist agents) and api (document-intake vision, backend/app/routers
  # /ingestion.py) construct a ModelGateway. A service that never calls
  # get_model_gateway() simply ignores these.
  MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
  OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
  OPENROUTER_SITE_NAME: ${OPENROUTER_SITE_NAME:-Renewable Energy Orchestrator}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
  MODEL_RATE_LIMIT_PER_MINUTE: ${MODEL_RATE_LIMIT_PER_MINUTE:-20}
  MODEL_RATE_LIMIT_PER_DAY: ${MODEL_RATE_LIMIT_PER_DAY:-2000}

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: reo
      POSTGRES_PASSWORD: reo
      POSTGRES_DB: reo
    ports: ["127.0.0.1:5433:5432"]  # 5433 on the host: 5432 is often taken by a native/Homebrew postgres; containers use "postgres:5432" internally
    volumes: ["reo-postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reo -d reo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]  # 6380 on the host: 6379 is often taken by a native redis; containers use "redis:6379" internally
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. Was MinIO until MinIO discontinued free
  # distribution of its Docker images entirely (docker.io/minio/minio and
  # minio/mc both now 404/access-denied, as does the dl.min.io binary
  # download server — not just a version bump, a full shutdown of their
  # free channel). SeaweedFS's S3 gateway is a verified drop-in: the app
  # code only ever does plain boto3 S3 calls (put_object/get_object/
  # generate_presigned_url), nothing MinIO-specific, and those are
  # confirmed working against this image/command/config as-is.
  seaweedfs:
    image: chrislusf/seaweedfs:4.22
    command: server -s3 -dir=/data -ip.bind=0.0.0.0 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - reo-objectstore-data:/data
      - ./seaweedfs-init/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:9000:8333"  # S3 API — same host port MinIO used, so S3_PUBLIC_ENDPOINT_URL below needs no change
      - "127.0.0.1:9001:8888"  # filer's own file-browser UI — not a bucket-oriented console like MinIO's, but the closest thing to one here
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9333/cluster/status | grep -q IsLeader"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs-init:
    build: { context: ../.., dockerfile: platform/backend/Dockerfile }  # reuses the api image for its python+boto3+reo_common, same pattern as `migrate` reusing it for alembic
    environment: *python-env
    depends_on:
      seaweedfs: { condition: service_healthy }
    volumes: ["./seaweedfs-init:/seaweedfs-init:ro"]
    entrypoint: ["python", "/seaweedfs-init/bootstrap_buckets.py"]

  # Stands in for "a client's own database" — pre-loaded on first boot (see
  # source-db-init/) with the reference dataset's 8 CSVs as real SQL tables,
  # so Connector Studio's `database` kind (backend/app/routers/connectors.py)
  # has something real to connect a connection string to, alongside the
  # `data_table` kind's local-path option pointed at the same files. Not
  # reachable from outside the docker network by name — only `source-db` is
  # in the database-connector egress allowlist (see connectors.py).
  source-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reo_source
      POSTGRES_PASSWORD: reo-source-secret
      POSTGRES_DB: client_export
    ports: ["127.0.0.1:5434:5432"]  # host-side access for manual poking (psql); containers use "source-db:5432"
    volumes:
      - reo-source-db-data:/var/lib/postgresql/data
      - ../../data:/csv:ro
      - ./source-db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reo_source -d client_export"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: { context: ../.., dockerfile: platform/backend/Dockerfile }
    environment: *python-env
    depends_on: { postgres: { condition: service_healthy } }
    working_dir: /app/platform/database
    entrypoint: ["alembic", "upgrade", "head"]

  api:
    build: { context: ../.., dockerfile: platform/backend/Dockerfile }
    environment:
      <<: *python-env
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000  # browsers/curl on the host use this; container-to-container S3 calls still use S3_ENDPOINT_URL=http://seaweedfs:8333
      # Real OIDC IdP (see the keycloak service below) — OIDC_ISSUER is
      # container-network (server-to-server token exchange/JWKS),
      # OIDC_AUTHORIZE_URL_PUBLIC is host-reachable (the browser's redirect
      # target), matching this file's S3 public/private URL split for the
      # same reason. Client secret is a dev-only value matching
      # keycloak-init/realm-export.json — never used outside local/demo.
      OIDC_ISSUER: http://keycloak:8080/realms/reo
      OIDC_AUTHORIZE_URL_PUBLIC: http://localhost:8081/realms/reo/protocol/openid-connect/auth
      OIDC_CLIENT_ID: reo-platform
      OIDC_CLIENT_SECRET: reo-platform-secret
      OIDC_REDIRECT_URI: http://localhost:8000/auth/sso/callback
      FRONTEND_BASE_URL: http://localhost:5173
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["../../data:/data:ro"]

  # Real external OIDC identity provider (production-readiness gap:
  # "authlib OIDC client wired but never tested against a real IdP").
  # Keycloak is a genuine, spec-compliant, widely-deployed IdP — not a mock
  # — so a login through it exercises the actual authorization-code
  # redirect, token exchange, and JWKS-verified id_token any real IdP
  # integration needs. `--import-realm` provisions the "reo" realm, the
  # "reo-platform" client, and one demo user fresh on every start from
  # keycloak-init/realm-export.json, so this needs no manual console setup
  # and no persistent volume. Not in any other service's `depends_on` — SSO
  # is opt-in (Configuration Studio's sso_enabled) and must never block the
  # rest of the stack from starting.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["127.0.0.1:8081:8080"]  # host-reachable — the browser is redirected here to log in
    volumes:
      - ./keycloak-init:/opt/keycloak/data/import:ro
      # Reskins the login page to match the dashboard's own (see the "reo"
      # theme's own comments) — activated per-realm via realm-export.json's
      # loginTheme, not a Keycloak-wide default, so it only ever affects
      # this platform's own realm.
      - ./keycloak-theme/reo:/opt/keycloak/themes/reo:ro

  optimizer-worker:
    build: { context: ../.., dockerfile: platform/policy/Dockerfile }
    environment: *python-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  agent-worker:
    build: { context: ../.., dockerfile: platform/agent/Dockerfile }
    environment: *python-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  ot-gateway-sim:
    build: { context: ../.., dockerfile: platform/guardrails/ot-gateway-sim/Dockerfile }
    environment: *python-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports: ["127.0.0.1:8010:8010"]

  edge-simulator:
    build: { context: ../.., dockerfile: platform/infrastructure/edge-simulator/Dockerfile }
    environment: *python-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    volumes: ["../../data:/data"]

  export-worker:
    build: { context: ../.., dockerfile: platform/output/export-worker/Dockerfile }
    environment: *python-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      seaweedfs-init: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ../../platform/frontend }
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [api]

volumes:
  reo-postgres-data:
  reo-objectstore-data:
  reo-source-db-data:
