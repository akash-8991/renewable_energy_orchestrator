name: Windows Docker capability probe

# Temporary/manual-only: checks whether the windows-latest hosted runner can
# actually run Linux containers, to decide whether a genuine end-to-end
# REO-Launcher.exe test (real docker compose up on real Windows) is feasible
# in CI at all, before investing in a full pipeline for it.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Docker version
        run: docker version
      - name: Docker info
        run: docker info
      - name: Try running a Linux container
        run: docker run --rm hello-world
      - name: Try docker compose
        run: docker compose version
