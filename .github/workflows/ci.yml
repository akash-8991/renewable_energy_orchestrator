name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: reo
          POSTGRES_PASSWORD: reo
          POSTGRES_DB: reo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reo -d reo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://reo:reo@localhost:5432/reo
      ASYNC_DATABASE_URL: postgresql+asyncpg://reo:reo@localhost:5432/reo
      REDIS_URL: redis://localhost:6379/0
      MODEL_PROVIDER: mock
      PYTHONPATH: ${{ github.workspace }}/platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install reo_common
        run: pip install -e platform/packages/reo_common

      - name: Install backend + test deps
        run: |
          pip install -r platform/backend/requirements.txt
          pip install -r platform/policy/requirements.txt
          pip install -r platform/agent/requirements.txt
          pip install pytest ruff

      - name: Lint (ruff)
        run: ruff check platform/packages platform/backend platform/policy platform/agent platform/models platform/database platform/guardrails platform/evaluation platform/output --exit-zero

      - name: Run DB migrations
        run: |
          cd platform/database
          alembic upgrade head

      - name: Run tests
        run: pytest platform/tests -v

  build-images:
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: platform/backend/Dockerfile
          - name: policy
            dockerfile: platform/policy/Dockerfile
          - name: agent
            dockerfile: platform/agent/Dockerfile
          - name: ot-gateway-sim
            dockerfile: platform/guardrails/ot-gateway-sim/Dockerfile
          - name: edge-simulator
            dockerfile: platform/infrastructure/edge-simulator/Dockerfile
          - name: export-worker
            dockerfile: platform/output/export-worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }} image
        run: docker build -f ${{ matrix.dockerfile }} -t reo-${{ matrix.name }}:ci .

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: platform/frontend/package-lock.json
      - run: npm ci
        working-directory: platform/frontend
      - run: npm run build
        working-directory: platform/frontend

  demo-script-smoke-test:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4

      - name: Bring up the full stack
        run: docker compose -f platform/infrastructure/docker-compose.yml up -d --build
        env:
          MODEL_PROVIDER: mock

      - name: Wait for api to be healthy
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "api never became healthy" && exit 1

      - name: Seed the reference tenant
        run: docker compose -f platform/infrastructure/docker-compose.yml exec -T api python /app/platform/database/seed.py

      - name: Wait one decision cycle
        run: sleep 15

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install demo_runner dependencies
        run: pip install httpx

      - name: Run the doc 08 §4 demo script against the live stack
        run: python platform/tests/demo_runner.py --base-url http://localhost:8000

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f platform/infrastructure/docker-compose.yml logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f platform/infrastructure/docker-compose.yml down -v
